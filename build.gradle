plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version
base { archivesName = project.archives_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // MCA Reborn and Gently Holds are installed separately; only compiled against
    compileOnly files("libs/mca-fabric-8.1.11+26.1.2.jar")
    compileOnly files("libs/gentlyholds-1.2.3+mc26.1.2.jar")
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") { expand "version": version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
